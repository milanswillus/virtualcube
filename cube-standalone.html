<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cherrychrono</title>
<!--
  Erzeugt von tools/build-preview.mjs – NICHT von Hand ändern.
  Alles steckt in dieser Datei, sie läuft per Doppelklick ohne Server.
-->
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
/*
 * cube.css – Styles für cherrychrono, den eingebetteten Würfel-Timer.
 *
 * Die Bildsprache ist die des Dashboards und damit die von milxn.de: schwarz
 * oder weiss, Courier Prime, ein einziges Rot als Akzent, durchgehend
 * kleingeschriebene Beschriftungen, Zahlen in Archivo Black kursiv, und alles
 * sitzt in Tafeln mit einem Haarstrich als Rahmen. Bewegung gibt es reichlich,
 * aber nur beim Erscheinen und beim Wechsel – nichts zappelt dauerhaft.
 *
 * Alle Selektoren sind mit `cb-` präfixiert, alle Variablen mit `--cb-`.
 * Schriftfamilie und Textfarbe werden für den Fliesstext bewusst NICHT gesetzt,
 * sondern von der Seite geerbt.
 *
 * Wichtig ist die durchgehende Kette aus `transform-style: preserve-3d`:
 * .cb-scene → .cb-cube → .cb-cubie → .cb-facelet. Bricht sie an einer Stelle
 * ab, flacht der Browser die Kindelemente auf eine Ebene ab und der Würfel
 * zerfällt.
 *
 * --cb-cubie / --cb-half / --cb-size / --cb-body setzt cubeRenderer.js.
 * Die data-Attribute am .cb-app steuern das Aussehen (siehe embed.js):
 *   data-mode   = virtual | timer
 *   data-scheme = minimal | classic
 *   data-view   = solid | ghost | hints
 *   data-camera = angled | front
 *   data-theme  = dark | light   (gemessen, nicht eingestellt)
 *   data-state  = idle | scrambling | ready | holding | solving | solved
 */

.cb-app {
  --cb-scale: 1;
  --cb-hint-gap: 92px;   /* Abstand der versetzten Tafeln zur Würfelfläche */

  /*
   * Linien und Flächen als neutrales Grau mit Deckkraft statt als feste Farbe:
   * derselbe Wert trägt dadurch auf schwarzem wie auf weissem Grund, und die
   * einbettende Seite darf ihr Thema umschalten, ohne dass hier etwas nachzieht.
   */
  --cb-line: rgba(128, 128, 128, 0.26);
  --cb-line-soft: rgba(128, 128, 128, 0.14);
  --cb-fill: rgba(128, 128, 128, 0.12);
  --cb-bar: color-mix(in srgb, var(--cb-accent) 55%, transparent);

  --cb-display: 'Archivo Black', 'Arial Black', Impact, sans-serif;
  --cb-radius: 4px;      /* der Radius des Logo-Chips, überall derselbe */
  --cb-gap: 12px;

  text-align: left;
  user-select: none;

  /*
   * Bezug für die Abfragen weiter unten. Es zählt die Breite, die die
   * einbettende Seite hergibt – nicht die des Fensters. Derselbe Würfel steht
   * mal in einer schmalen Spalte und mal über die ganze Seite.
   */
  container-type: inline-size;
}

/*
 * Akzent und die Rampe der Abschnitte – cross · f2l · oll · pll, hell nach
 * dunkel. EINE Farbe in vier Stufen, weil die vier Abschnitte eine feste
 * Reihenfolge haben; vier verschiedene Farben würden behaupten, sie wären
 * gleichrangig.
 *
 * Je Untergrund eigene Stufen: die Rampe muss sich innerhalb ihrer vier
 * Schritte unterscheiden UND vom Grund abheben. Auf Schwarz geht das nach oben
 * (hell), auf Weiss nach unten (dunkel); dieselben vier Werte für beides gibt
 * es nicht. Welcher Fall vorliegt, misst embed.js an der geerbten Schriftfarbe.
 *
 * Der Tooltip steht ausserhalb von .cb-app (siehe unten) und braucht dieselben
 * Werte – deshalb hier gemeinsam, statt sie zweimal zu notieren.
 */
.cb-app, .cb-tip {
  --cb-accent: var(--accent, #e8221f);
  --cb-p0: #ffd6c9;
  --cb-p1: #fb8f68;
  --cb-p2: #e5231a;
  --cb-p3: #8a0d0a;
}

.cb-app[data-theme="light"], .cb-tip[data-theme="light"] {
  --cb-p0: #fca07f;
  --cb-p1: #ee4a2c;
  --cb-p2: #ab120d;
  --cb-p3: #4f0b09;

  /* Auf Weiss trägt dieselbe Deckkraft weniger – der Balken darf kräftiger. */
  --cb-bar: color-mix(in srgb, var(--cb-accent) 78%, transparent);
}

.cb-app *,
.cb-app *::before,
.cb-app *::after { box-sizing: border-box; }

/* ── Bewegung ───────────────────────────────────────────────────────────
 *
 * Zwei Sorten: Tafeln kippen beim Erscheinen einmal herein (gestaffelt über
 * `--i`), Daten wachsen aus der Grundlinie hoch. Beides läuft genau einmal.
 * Dauerhaft bewegt sich nur der Würfel im Leerlauf – und der ist das Motiv.
 */
@keyframes cbPanelIn {
  from { opacity: 0; transform: rotateX(-18deg) translateY(24px) scale(0.96); }
  to   { opacity: 1; transform: rotateX(0deg) translateY(0) scale(1); }
}
@keyframes cbFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes cbRowIn  { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
@keyframes cbRise   { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes cbDraw   { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes cbPop    { 0% { transform: scale(1); } 35% { transform: scale(1.09); } 100% { transform: scale(1); } }
@keyframes cbPulse  { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
@keyframes cbFlash  { 0%, 100% { color: inherit; } 30% { color: var(--cb-accent); } }
@keyframes cbCheer {
  0%   { transform: rotateY(0deg) scale(1); }
  55%  { transform: rotateY(200deg) scale(1.06); }
  100% { transform: rotateY(360deg) scale(1); }
}
@keyframes cbFoldIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@keyframes cbFloatLogo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes cbSpin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }

/* ── Tafeln ─────────────────────────────────────────────────────────── */

.cb-panel {
  border: 1px solid var(--cb-line);
  border-radius: var(--cb-radius);
  padding: 15px;
  min-width: 0;
  transform-style: preserve-3d;
  animation: cbPanelIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  animation-delay: calc(var(--i, 0) * 60ms);
}

.cb-panel-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
  text-transform: lowercase;
}

.cb-panel-head .h { font-size: 12px; font-weight: 700; }
.cb-panel-head .s { font-size: 10px; opacity: 0.45; text-align: right; }

.cb-grid { display: grid; gap: var(--cb-gap); }

/* ── Kopfzeile: Moduswahl ───────────────────────────────────────────── */

/*
 * Drei Bereiche: Umschalter links, Logo mittig, Notiz rechts. Als Raster mit
 * drei gleich breiten Spalten und nicht als `space-between`, denn nur so steht
 * das Logo in der MITTE DER SEITE und nicht in der Mitte des Restplatzes –
 * links und rechts sind verschieden breit.
 */
.cb-top {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  margin-bottom: var(--cb-gap);
  animation: cbFadeUp 0.45s ease both;
}

.cb-top > .cb-switch { justify-self: start; }

.cb-top-meta {
  justify-self: end;
  text-align: right;
  font-size: 10px;
  opacity: 0.45;
  text-transform: lowercase;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
}

.cb-top-meta a.cb-me-link {
  color: inherit;
  text-decoration: none;
  font-weight: 700;
  opacity: 0.85;
  transition: opacity 0.15s ease, color 0.15s ease;
}

.cb-top-meta a.cb-me-link:hover {
  opacity: 1;
  color: var(--cb-accent);
}

/* ── Logo ───────────────────────────────────────────────────────────────
 *
 * Eins zu eins der Chip von milxn.de: dasselbe Rot, dieselbe Rundung, dasselbe
 * Schweben, dieselbe Neigung unter der Maus. Nur die Schriftgrösse darf
 * schrumpfen – "cherrychrono" ist gut doppelt so lang wie "milxn" und wäre
 * sonst auf dem Handy breiter als der Bildschirm.
 */
.cb-logo {
  justify-self: center;
  background: var(--cb-accent);
  border-radius: 4px;
  padding: 12px 32px;
  box-shadow: 0 8px 24px rgba(232, 34, 31, 0.25);
  transform-style: preserve-3d;
  perspective: 600px;
  transition: transform 0.15s ease-out;
  cursor: pointer;
  user-select: none;
  animation: cbFloatLogo 4.5s ease-in-out infinite;
}

.cb-logo span {
  display: inline-block;
  color: #ffffff;
  font-family: var(--cb-display);
  font-size: clamp(22px, 4.6cqw, 42px);
  font-weight: 900;
  font-style: italic;
  letter-spacing: -0.03em;
  line-height: 1;
  text-transform: lowercase;
}

/*
 * Schmal wandert das Logo in die erste Zeile und bekommt sie für sich – der
 * Umschalter darunter. Nebeneinander bliebe für den Chip so wenig Platz, dass
 * er auf Kleinstschrift schrumpfen müsste.
 */
@container (max-width: 520px) {
  .cb-top { grid-template-columns: 1fr 1fr; }
  .cb-logo { grid-column: 1 / -1; grid-row: 1; padding: 10px 22px; }
  .cb-top > .cb-switch { grid-row: 2; }
  .cb-top-meta { grid-row: 2; }
}

/*
 * Der Umschalter. Der rote Balken liegt HINTER den Beschriftungen und fährt
 * beim Wechsel hinüber – die Bewegung sagt, dass es zwei Zustände desselben
 * Schalters sind und nicht zwei Knöpfe.
 */
.cb-switch {
  position: relative;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  border: 1px solid var(--cb-line);
  border-radius: var(--cb-radius);
  padding: 2px;
  isolation: isolate;
}

.cb-switch::before {
  content: "";
  position: absolute;
  z-index: -1;
  top: 2px;
  bottom: 2px;
  left: 2px;
  width: calc(50% - 2px);
  background: var(--cb-accent);
  border-radius: 2px;
  transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.cb-app[data-mode="virtual"] .cb-switch[data-key="mode"]::before,
.cb-app[data-scope="all"]    .cb-switch[data-key="scope"]::before {
  transform: translateX(100%);
}

.cb-switch button {
  font: inherit;
  font-size: 11px;
  line-height: 1;
  padding: 7px 14px;
  background: none;
  border: 0;
  color: inherit;
  cursor: pointer;
  text-transform: lowercase;
  opacity: 0.55;
  transition: opacity 0.2s ease, color 0.2s ease;
}

.cb-switch button[aria-pressed="true"] {
  opacity: 1;
  font-weight: 700;
  color: #fff;
}

.cb-switch-sm button { font-size: 9px; padding: 4px 8px; }

/* ── Grundriss ──────────────────────────────────────────────────────────
 *
 * Drei Bausteine: Bühne (`cb-main`), Trainer und die Seitenspalte mit Zeiten.
 * Schmal stehen sie untereinander, breit nebeneinander – und der Trainer
 * wandert dabei von unten nach links, weil er beim Lösen neben dem Würfel
 * stehen muss und nicht darunter.
 */
.cb-layout {
  display: grid;
  gap: var(--cb-gap);
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "time" "main" "coach" "side";
}

.cb-timecard { grid-area: time; }
.cb-main  { grid-area: main; display: flex; flex-direction: column; }
.cb-side  { grid-area: side; }
.cb-coach { grid-area: coach; }

/*
 * Ab hier steht links die Spalte, auf die man beim Lösen schaut – Zeit oben,
 * Trainer darunter, Zahlen unten –, und rechts die Bühne über die volle Höhe.
 */
@container (min-width: 700px) {
  .cb-layout {
    grid-template-columns: minmax(230px, 1fr) minmax(0, 2fr);
    grid-template-areas:
      "time  main"
      "coach main"
      "side  main";
    grid-template-rows: auto auto 1fr;
    align-items: start;
  }
}

@container (min-width: 1040px) {
  .cb-layout {
    grid-template-columns: minmax(230px, 1fr) minmax(0, 2.3fr) minmax(240px, 1fr);
    grid-template-areas:
      "time  main side"
      "coach main side";
    grid-template-rows: auto 1fr;
  }
}

/*
 * Ohne Trainer bekommt die Zeit den Platz: im Timer-Modus ist sie das Motiv der
 * Seite, der Würfel darunter nur noch Vorschau des Scrambles.
 */
.cb-app[data-mode="timer"] .cb-layout,
.cb-app[data-coach="off"] .cb-layout {
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "time" "main" "side";
}

@container (min-width: 700px) {
  .cb-app[data-mode="timer"] .cb-layout,
  .cb-app[data-coach="off"] .cb-layout {
    grid-template-columns: minmax(0, 2.4fr) minmax(240px, 1fr);
    grid-template-areas:
      "time side"
      "main side";
    grid-template-rows: auto 1fr;
  }
}

/* ── Diagramme und Klappbereiche ────────────────────────────────────── */

.cb-cards, .cb-charts, .cb-lower, .cb-folds { margin-top: var(--cb-gap); }

/* Wie die Dreierreihe auf dem Dashboard: umbrechen statt schrumpfen. */
.cb-cards { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }

@container (min-width: 620px) {
  .cb-charts { grid-template-columns: 1fr 1fr; }
  .cb-charts > :first-child { grid-column: 1 / -1; }
  .cb-lower  { grid-template-columns: 2fr 1fr; }
  .cb-folds  { grid-template-columns: repeat(3, 1fr); align-items: start; }
}

@container (min-width: 1040px) {
  .cb-charts { grid-template-columns: 2fr 1.3fr 1fr; }
  .cb-charts > :first-child { grid-column: auto; }
}

/* ── Scramble ───────────────────────────────────────────────────────── */

.cb-scramble {
  font-size: 13px;
  line-height: 1.6;
  word-spacing: 0.35em;
  min-height: 2.6em;
  opacity: 0.9;
}

/* Beim Mischen tritt der Scramble zurück – er gilt ja noch nicht. */
.cb-app[data-state="scrambling"] .cb-scramble { opacity: 0.4; }

.cb-mini {
  font: inherit;
  font-size: 10px;
  line-height: 1;
  padding: 5px 9px;
  background: transparent;
  color: inherit;
  border: 1px solid var(--cb-line);
  border-radius: 2px;
  cursor: pointer;
  text-transform: lowercase;
  opacity: 0.7;
  transition: opacity 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
}

.cb-mini:hover { opacity: 1; color: var(--cb-accent); border-color: var(--cb-accent); }
.cb-mini:active { transform: translateY(1px); }
.cb-mini[aria-pressed="true"] {
  background: var(--cb-accent);
  border-color: var(--cb-accent);
  color: #fff;
  opacity: 1;
}
.cb-mini.cb-danger:hover { color: #fff; background: var(--cb-accent); }
.cb-mini[data-armed] { background: var(--cb-accent); border-color: var(--cb-accent); color: #fff; opacity: 1; }

/* ── Die Zeit ───────────────────────────────────────────────────────────
 *
 * Die Anzeigefläche der Stoppuhr. Im Timer-Modus ist sie das Motiv der Seite
 * und entsprechend gross; im Virtual-Modus steht der Würfel im Mittelpunkt und
 * die Zahl tritt zurück.
 */
/* Die Karte ist im Timer-Modus zugleich die Fläche, die man antippt. */
.cb-timecard { touch-action: manipulation; }

.cb-time {
  font-family: var(--cb-display);
  font-style: italic;
  font-size: clamp(32px, 4.2cqw, 44px);
  letter-spacing: -0.045em;
  line-height: 0.95;
  font-variant-numeric: tabular-nums;
  transition: color 0.15s ease, opacity 0.15s ease;
}

/*
 * Im Timer-Modus läuft die Karte über die ganze Hauptspalte – dort darf die
 * Zahl so gross werden, wie man sie aus zwei Metern Abstand noch liest, und
 * alles steht mittig wie an jedem Timer, den man kennt.
 */
.cb-app[data-mode="timer"] .cb-time { font-size: clamp(64px, 15cqw, 124px); }
.cb-app[data-mode="timer"] .cb-scramble { font-size: 15px; }
.cb-app[data-mode="timer"] .cb-timecard,
.cb-app[data-mode="timer"] .cb-main { text-align: center; }
.cb-app[data-mode="timer"] .cb-binds { justify-content: center; }

.cb-app[data-state="idle"] .cb-time,
.cb-app[data-state="scrambling"] .cb-time { opacity: 0.3; }
.cb-app[data-state="ready"] .cb-time      { opacity: 0.55; }

/*
 * Gedrückt ist rot. Ohne Wartezeit und ohne Zwischenstufe: die Farbe IST die
 * Rückmeldung, dass der nächste Versuch am Finger hängt.
 */
.cb-app[data-state="holding"] .cb-time {
  color: var(--cb-accent);
  animation: cbPulse 1.1s ease-in-out infinite;
}

.cb-app[data-state="solved"] .cb-time {
  color: var(--cb-accent);
  animation: cbPop 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.cb-hint {
  font-size: 11px;
  opacity: 0.55;
  min-height: 1.4em;
  margin-top: 8px;
  text-transform: lowercase;
}

/* Die feste Tastenliste. Sie steht unten in der Karte und ändert sich nur mit
   dem Modus – deshalb darf sie ruhig bleiben und muss nicht auffallen. */
.cb-binds {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  margin-top: 14px;
  padding-top: 11px;
  border-top: 1px solid var(--cb-line-soft);
  font-size: 10px;
  opacity: 0.5;
  text-transform: lowercase;
}

.cb-binds span { display: flex; align-items: center; gap: 5px; }

.cb-binds kbd {
  font-family: inherit;
  font-size: 9px;
  padding: 2px 5px;
  border: 1px solid var(--cb-line);
  border-radius: 2px;
}

/*
 * Der Fortschritt eines laufenden Versuchs: dieselben vier Abschnitte, die
 * hinterher im Diagramm stehen, nur live. Erledigte tragen ihre Zwischenzeit,
 * der laufende ist rot umrandet.
 */
.cb-phase-strip {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  margin-top: 10px;
  min-height: 24px;
}

.cb-phase-strip:empty { display: none; }

/* In der schmalen Zeit-Karte stehen die vier Abschnitte untereinander statt
   nebeneinander – sonst bricht jeder Eintrag für sich um. */
.cb-app[data-mode="virtual"] .cb-phase-strip { justify-content: flex-start; }

.cb-phase-strip span {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  padding: 3px 7px;
  border: 1px solid transparent;
  border-radius: 2px;
  opacity: 0.4;
  text-transform: lowercase;
  transition: opacity 0.2s ease, border-color 0.2s ease;
}

.cb-phase-strip span i {
  width: 6px; height: 6px; border-radius: 50%;
  display: block; flex: none; opacity: 0.7;
}

.cb-phase-strip span b { font-weight: 700; font-variant-numeric: tabular-nums; }
.cb-phase-strip span[data-done] { opacity: 0.85; }
.cb-phase-strip span[data-done] i { opacity: 1; }
.cb-phase-strip span[data-active] {
  opacity: 1;
  border-color: var(--cb-accent);
  animation: cbFadeUp 0.25s ease both;
}

/* ── 3D-Bühne ───────────────────────────────────────────────────────── */
.cb-stage {
  display: flex;
  align-items: center;
  justify-content: center;
  height: calc(var(--cb-size) * 1.55 * var(--cb-scale));
  perspective: 1500px;
  perspective-origin: 50% 45%;
}

.cb-scene {
  position: relative;
  width: var(--cb-size);
  height: var(--cb-size);
  transform-style: preserve-3d;
  /* Die "Kamera". Beide Winkel kommen aus data-camera am .cb-app. */
  transform: scale(var(--cb-scale)) rotateX(var(--cb-tilt)) rotateY(var(--cb-turn));
}

/*
 * Blickwinkel. Voreinstellung "angled": von schräg oben rechts auf U, F und R –
 * die Ansicht, die alle drei Seiten gleich gut zeigt.
 */
.cb-app {
  --cb-tilt: -26deg;   /* Neigung: wie weit von oben */
  --cb-turn: -34deg;   /* Drehung: wie weit von der Seite */
}

/*
 * Vor dem Lösen dreht sich der Würfel einmal ganz um sich selbst: man sieht
 * alle sechs Seiten, ohne etwas zu drücken. Das ist der Moment, in dem der
 * Scramble noch gelesen wird.
 *
 * Mit dem ersten Zug ist Schluss – und zwar sofort, nicht ausklingend: der
 * Würfel steht damit in derselben Sekunde wieder gerade, in der gelöst wird.
 * Das muss so sein, denn in halber Drehung läge nicht mehr rechts, was die
 * R-Taste dreht.
 *
 * Die Drehung sitzt auf `.cb-cube`, weil der Renderer seine Transforms auf die
 * `.cb-cubie`-Kinder schreibt (cubeRenderer.js) und diese Ebene nie anfasst.
 */
.cb-app[data-state="idle"] .cb-cube,
.cb-app[data-state="scrambling"] .cb-cube,
.cb-app[data-state="ready"] .cb-cube {
  animation: cbSpin 28s linear infinite;
}

.cb-app[data-state="solved"] .cb-cube {
  animation: cbCheer 1.1s cubic-bezier(0.3, 0.7, 0.3, 1);
}

/*
 * ── Kamera "front": der Würfel, wie man ihn in der Hand hält ──────────
 *
 * Genau auf die Kante zwischen U und F geschaut: 45° von oben, ohne jede
 * seitliche Drehung. Beide Seiten stehen dadurch im selben Winkel zum
 * Betrachter und sind gleich gut zu lesen.
 *
 * `--cb-turn: 0` heisst zugleich: L und R stehen exakt auf der Kante zum
 * Betrachter und sind nicht mehr zu sehen. Das ist so gewollt – wer die
 * Seiten braucht, nimmt "angled" oder schaltet "hints" dazu (das holt L, D und
 * B als versetzte Tafeln heraus; nur R bleibt in dieser Ansicht verdeckt).
 */
.cb-app[data-camera="front"] {
  --cb-tilt: -45deg;
  --cb-turn: 0deg;
}

/*
 * Geradeaus betrachtet muss die Tiefe allein aus der Perspektive kommen – es
 * gibt ja keinen Schrägblick mehr, der sie zeigt. Der kurze Abstand staucht die
 * hintere Kante sichtbar gegenüber der vorderen und macht daraus wieder einen
 * Körper statt zweier flacher Tafeln.
 *
 * Warum so viel kürzer als die 1500px der Schrägansicht: `scale()` ist zweiter
 * Dimension und lässt die Tiefe des Würfels unberührt. Er wird also breiter und
 * höher, bleibt aber 192px tief – je grösser er skaliert wird, desto schwächer
 * wirkt dieselbe Perspektive. Die Verkürzung muss das ausgleichen.
 */
.cb-app[data-camera="front"] .cb-stage {
  perspective: 850px;

  /*
   * Passgenau zur echten Höhe: bei 45° Neigung ist der Würfel 1,41 mal so hoch
   * wie breit, nicht so hoch wie die Diagonale der Schrägansicht. Das gilt in
   * JEDER Breite – "front" ist die Voreinstellung, und ohne diese Zeile
   * schnitte die Karte auf schmalen Fenstern unten ab.
   */
  height: calc(var(--cb-size) * 1.5 * var(--cb-scale));
}

.cb-cube {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
}

/*
 * Ein Cubie. Es wird über left/top + negative Margins am Würfelmittelpunkt
 * ausgerichtet – bewusst NICHT über translate(-50%,-50%), weil `transform`
 * komplett von cubeRenderer.js gesetzt wird.
 */
.cb-cubie {
  position: absolute;
  left: 50%;
  top: 50%;
  margin-left: calc(var(--cb-half) * -1);
  margin-top: calc(var(--cb-half) * -1);
  width: var(--cb-cubie);
  height: var(--cb-cubie);
  transform-style: preserve-3d;
  will-change: transform;
}

.cb-facelet {
  position: absolute;
  inset: 0;
  background: var(--cb-body);
  /* Schliesst Haarrisse zwischen benachbarten Flächen. */
  box-shadow: 0 0 0 1px var(--cb-body);
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  -webkit-transform-style: preserve-3d;
  transform-style: preserve-3d;
}

/*
 * Der farbige Aufkleber – sein Rand erzeugt das schwarze Raster.
 * `--cb-inset` ist der Abstand zur Cubie-Kante und damit die Breite der
 * schwarzen Fuge; der "ghost"-Modus dreht ihn weiter auf.
 */
.cb-facelet > .cb-cap {
  position: absolute;
  inset: var(--cb-inset, 6px);
  border-radius: 4px;
  box-shadow: inset 0 0 0 1px #000;
  transition: opacity 0.2s ease;
  -webkit-transform: translateZ(0.5px);
  transform: translateZ(0.5px);
}

/* ── Modus "ghost": Körper unsichtbar, nur noch schwebende Flächen ──── */
.cb-app[data-view="ghost"] .cb-facelet {
  background: transparent;
  box-shadow: none;
}

/*
 * Die Sticker bleiben deckend. Der Durchblick entsteht allein dadurch, dass
 * der Würfelkörper fehlt: durch die Lücken zwischen den Kacheln sieht man die
 * Kanten und Flächen der dahinterliegenden Seiten.
 *
 * Die Fuge ist dabei schmaler als man denkt: nachgemessen belegt der Aufkleber
 * rund 84 % der Cubie-Fläche, also 5px Rand bei 64px Kante. Der Durchblick
 * kommt fast vollständig vom fehlenden Körper, nicht von breiten Lücken – mit
 * weiten Fugen zerfällt der Würfel optisch in Einzelplättchen.
 */
.cb-app[data-view="ghost"] {
  --cb-inset: 5px;
}

.cb-app[data-view="ghost"] .cb-cap {
  border-radius: 2px;
}

/* ── Modus "hints": versetzte Tafeln der verdeckten Seiten ──────────── */
.cb-hintface {
  position: absolute;
  inset: var(--cb-inset, 6px);
  display: none;
  border-radius: 4px;
  box-shadow: inset 0 0 0 1px #000;
  -webkit-backface-visibility: visible;
  backface-visibility: visible;
}

/* data-show setzt cubeRenderer.js für alle gerade abgewandten Seiten. */
.cb-app[data-view="hints"] .cb-hintface[data-show] { display: block; }

/* Die Tafeln brauchen ringsum Platz. */
.cb-app[data-view="hints"] { --cb-scale: 0.78; }
.cb-app[data-view="hints"] .cb-stage {
  height: calc(var(--cb-size) * 2.45 * var(--cb-scale));
}

/* ── Farbschemata ───────────────────────────────────────────────────── */

/* Reduziert, im Stil der Seite: schwarz / rot / weiss plus zwei Warmgrautöne.
   Die sechs Werte sind über die Helligkeit getrennt, nicht über den Farbton. */
.cb-app[data-scheme="minimal"] {
  --cb-U: #f2f0ec;
  --cb-D: #2a2a2a;
  --cb-F: #d8232a;
  --cb-B: #6d1114;
  --cb-R: #b6b2aa;
  --cb-L: #726e67;
}

/*
 * Klassisches Würfelschema, kräftig wie am Timer – die Voreinstellung.
 * Bewusst satter als die gedeckten WCA-Werte: auf schwarzem Grund und in der
 * Grösse, in der die Aufkleber hier stehen, muss die Farbe im Vorbeischauen
 * erkennbar sein, nicht erst beim Hinsehen.
 */
.cb-app[data-scheme="classic"] {
  --cb-U: #ffffff;
  --cb-D: #ffe600;
  --cb-F: #00c93c;
  --cb-B: #0a3bd8;
  --cb-R: #ee1414;
  --cb-L: #ff9500;
}

.cb-cap[data-face="U"], .cb-hintface[data-face="U"] { background: var(--cb-U); }
.cb-cap[data-face="D"], .cb-hintface[data-face="D"] { background: var(--cb-D); }
.cb-cap[data-face="F"], .cb-hintface[data-face="F"] { background: var(--cb-F); }
.cb-cap[data-face="B"], .cb-hintface[data-face="B"] { background: var(--cb-B); }
.cb-cap[data-face="R"], .cb-hintface[data-face="R"] { background: var(--cb-R); }
.cb-cap[data-face="L"], .cb-hintface[data-face="L"] { background: var(--cb-L); }

/* ── Seitenspalte: Bestzeit, Kacheln, Zeitenliste ───────────────────── */

/*
 * Die Bestzeit als eine grosse Zahl. Sie ist die Zahl, wegen der man wiederkommt
 * – alles andere daneben sind Kacheln in Lesegrösse.
 */
.cb-hero { margin-bottom: 14px; }

.cb-hero-v {
  font-family: var(--cb-display);
  font-style: italic;
  font-size: 40px;
  line-height: 0.9;
  letter-spacing: -0.05em;
  font-variant-numeric: tabular-nums;
}

.cb-app[data-pb] .cb-hero-v { animation: cbFlash 1.4s ease 2; }

.cb-hero-k { font-size: 10px; opacity: 0.45; margin-top: 5px; text-transform: lowercase; }

.cb-tiles {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
  margin-bottom: 14px;
}

.cb-tile { border-left: 1px solid var(--cb-line); padding-left: 9px; }
.cb-tile .k { font-size: 9px; opacity: 0.45; text-transform: lowercase; }
.cb-tile .v { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 1px; }

.cb-spark { width: 100%; height: 56px; display: block; overflow: visible; }

.cb-spark-key {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 9px;
  opacity: 0.45;
  text-transform: lowercase;
  margin: 2px 0 12px;
}

/* Ein schnellerer Schnitt ist die gute Richtung – deshalb trägt nur er den Akzent. */
.cb-trend { font-weight: 700; }
.cb-trend[data-dir="down"] { color: var(--cb-accent); opacity: 1; }

.cb-times {
  list-style: none;
  margin: 0;
  padding: 0;
  font-size: 11px;
}

.cb-times li {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid var(--cb-line-soft);
  font-variant-numeric: tabular-nums;
}

/* Der jüngste Versuch steht oben und schiebt sich beim Eintragen herein. */
.cb-times li:first-child { animation: cbRowIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both; }

.cb-times .n { opacity: 0.4; min-width: 1.8em; }
.cb-times b { font-weight: 700; }

/* Die Bestzeit der Auswahl wird ausgezeichnet, nicht nur mitgezählt. */
.cb-times li[data-best] b { color: var(--cb-accent); }

/*
 * Woher die Zeit kommt, steht als Punkt am Zeilenende – im Timer-Modus gibt es
 * keine Zwischenzeiten, und das soll man der Zeile ansehen.
 */
.cb-times li::after {
  content: "";
  width: 5px; height: 5px; border-radius: 50%;
  margin-left: auto;
  flex: none;
  background: currentColor;
  opacity: 0.25;
}
.cb-times li[data-mode="virtual"]::after { background: var(--cb-accent); opacity: 0.8; }

/*
 * Strafen und Löschen liegen über dem rechten Rand der Zeile und erscheinen
 * erst beim Darüberfahren. Absolut gesetzt, weil sie sonst dauerhaft Platz
 * belegen würden – bei acht Zeilen wäre die halbe Spalte Knöpfe, die man fast
 * nie braucht.
 */
.cb-row-acts {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  gap: 3px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease;
}

.cb-times li:hover .cb-row-acts,
.cb-times li:focus-within .cb-row-acts { opacity: 1; pointer-events: auto; }

/* Der Herkunftspunkt weicht, solange die Knöpfe da sind. */
.cb-times li:hover::after,
.cb-times li:focus-within::after { opacity: 0; }

.cb-row-acts .cb-mini { padding: 3px 5px; font-size: 9px; }

.cb-empty {
  font-size: 10px;
  opacity: 0.35;
  padding: 8px 0;
  text-transform: lowercase;
  border: 0 !important;
}

/* ── Karteninhalt ───────────────────────────────────────────────────────
 *
 * Der Bauplan einer Karte auf dem Dashboard, Wert für Wert übernommen: grosse
 * Zahl, eine Zeile Erklärung darunter, drei Kacheln mit Haarstrich, ein Balken,
 * eine Fusszeile. Wer die eine Seite kennt, liest die andere ohne Umgewöhnung.
 */

.cb-big { display: flex; align-items: baseline; gap: 7px; }

.cb-big .v {
  font-family: var(--cb-display);
  font-style: italic;
  font-size: 34px;
  letter-spacing: -0.04em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.cb-big .u { font-size: 11px; opacity: 0.5; text-transform: lowercase; }

.cb-sub { font-size: 11px; opacity: 0.6; margin-top: 5px; text-transform: lowercase; }

.cb-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 14px 0;
}

.cb-stat { border-left: 1px solid var(--cb-line); padding-left: 9px; }
.cb-stat .k { font-size: 9px; opacity: 0.45; text-transform: lowercase; }
.cb-stat .v { font-size: 14px; font-weight: 700; margin-top: 1px; font-variant-numeric: tabular-nums; }
.cb-stat .n { font-size: 9px; opacity: 0.4; margin-top: 2px; text-transform: lowercase; }

.cb-vital-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 11px;
  margin-bottom: 5px;
  text-transform: lowercase;
}

.cb-vital-row .k { opacity: 0.6; }
.cb-vital-row .v { font-weight: 700; }

.cb-meter { height: 5px; background: var(--cb-fill); border-radius: 1px; overflow: hidden; }

.cb-meter i {
  display: block;
  height: 100%;
  background: var(--cb-accent);
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

.cb-vital-foot {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 10px;
  opacity: 0.45;
  margin-top: 11px;
  padding-top: 11px;
  border-top: 1px solid var(--cb-line-soft);
  text-transform: lowercase;
}

/* ── Serie ──────────────────────────────────────────────────────────────
 *
 * Die letzten sieben Tage als Punkte, heute ganz rechts. Ein Blick genügt für
 * die Frage, die die grosse Zahl offenlässt: fehlt heute noch etwas?
 */
.cb-week { display: flex; gap: 5px; margin-top: 2px; }

.cb-week i {
  width: 100%;
  height: 6px;
  border-radius: 1px;
  background: var(--cb-fill);
}

.cb-week i[data-on] { background: var(--cb-accent); }
.cb-week i[data-today] { box-shadow: 0 0 0 1px var(--cb-line); }
.cb-week i[data-today][data-on] { box-shadow: 0 0 0 1px var(--cb-accent); }

/* ── Kalender ───────────────────────────────────────────────────────────
 *
 * Eine Spalte je Woche, eine Zeile je Wochentag – der Aufbau, den jeder von
 * GitHub kennt. Die Zellen sind `1fr` breit und quadratisch, dadurch passt der
 * Kalender in jede Kartenbreite, ohne dass etwas gerechnet werden müsste.
 */
/*
 * Zwei Spalten, zwei Zeilen: oben rechts die Monate, unten links die
 * Wochentage, unten rechts der Kalender. Als EIN Raster und nicht als
 * ineinandergeschachtelte Kästen – nur so stehen die Wochentage garantiert auf
 * der Höhe ihrer Zeile, ohne dass irgendwo eine Höhe nachgerechnet wird.
 */
.cb-heat-wrap {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 0 6px;
}

/* Der Zwischenbehälter verschwindet aus dem Raster, seine Kinder rücken auf. */
.cb-heat-body { display: contents; }

.cb-heat-months { grid-column: 2; grid-row: 1; }

.cb-heat-days {
  grid-column: 1;
  grid-row: 2;
  display: grid;
  grid-template-rows: repeat(7, 1fr);
  gap: 3px;                 /* dieselbe Fuge wie der Kalender – sonst driften
                               die Beschriftungen über sieben Zeilen weg */
  font-size: 8px;
  opacity: 0.35;
  text-transform: lowercase;
}

.cb-heat-days span { display: flex; align-items: center; }

/* mon · wed · fri stehen in Zeile 1, 3 und 5 – die übrigen bleiben leer. */
.cb-heat-days span:nth-child(1) { grid-row: 1; }
.cb-heat-days span:nth-child(2) { grid-row: 3; }
.cb-heat-days span:nth-child(3) { grid-row: 5; }

.cb-heat { grid-column: 2; grid-row: 2; }

.cb-heat-months {
  display: grid;
  grid-template-columns: repeat(var(--cb-weeks, 26), 1fr);
  gap: 3px;
  font-size: 8px;
  opacity: 0.35;
  margin-bottom: 4px;
  text-transform: lowercase;
}

/* Das Kürzel darf über die Nachbarspalten hinausragen, sonst wäre es
   abgeschnitten – eine Spalte ist schmaler als drei Buchstaben. */
.cb-heat-months span { white-space: nowrap; overflow: visible; }

.cb-heat {
  display: grid;
  grid-template-rows: repeat(7, 1fr);
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 3px;
}

.cb-heat i {
  aspect-ratio: 1;
  border-radius: 1px;
  background: var(--cb-fill);
  animation: cbFadeUp 0.4s ease both;
}

.cb-heat i[data-empty] { background: none; }
.cb-heat i[data-level="1"] { background: color-mix(in srgb, var(--cb-accent) 28%, transparent); }
.cb-heat i[data-level="2"] { background: color-mix(in srgb, var(--cb-accent) 50%, transparent); }
.cb-heat i[data-level="3"] { background: color-mix(in srgb, var(--cb-accent) 75%, transparent); }
.cb-heat i[data-level="4"] { background: var(--cb-accent); }

.cb-heat-key {
  display: flex;
  align-items: center;
  gap: 3px;
  font-size: 9px;
  opacity: 0.45;
  text-transform: lowercase;
}

.cb-heat-key i { width: 8px; height: 8px; border-radius: 1px; background: var(--cb-fill); }
.cb-heat-key i[data-level="1"] { background: color-mix(in srgb, var(--cb-accent) 28%, transparent); }
.cb-heat-key i[data-level="2"] { background: color-mix(in srgb, var(--cb-accent) 50%, transparent); }
.cb-heat-key i[data-level="3"] { background: color-mix(in srgb, var(--cb-accent) 75%, transparent); }
.cb-heat-key i[data-level="4"] { background: var(--cb-accent); }
.cb-heat-key span:first-child { margin-right: 2px; }
.cb-heat-key span:last-child { margin-left: 2px; }

/* Der Tagesablauf in drei Zahlen, unter den 24 Balken. */
.cb-daypart {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--cb-line-soft);
  font-size: 10px;
  opacity: 0.55;
  text-transform: lowercase;
}

.cb-daypart span { display: flex; gap: 5px; }
.cb-daypart b { font-weight: 700; opacity: 1; }

/* ── Diagramme ──────────────────────────────────────────────────────── */

.cb-scroll { overflow-x: auto; }

.cb-chart-times  { width: 100%; min-width: 320px; height: 200px; display: block; }
.cb-chart-phases { width: 100%; min-width: 300px; height: 168px; display: block; }
.cb-chart-dist   { width: 100%; min-width: 240px; height: 132px; display: block; }
.cb-chart-hours  { width: 100%; min-width: 260px; height: 140px; display: block; }
.cb-chart-tps    { margin-top: 14px; }

/* Die Balken wachsen aus der Grundlinie – deshalb der Ursprung unten. */
.cb-rise {
  transform-box: fill-box;
  transform-origin: bottom;
  animation: cbRise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

/* `pathLength="1"` macht die Strichlänge unabhängig von der echten Länge. */
.cb-draw {
  stroke-dasharray: 1 1;
  animation: cbDraw 0.9s ease 0.25s both;
}

.cb-legend { display: flex; gap: 11px; }
.cb-legend span {
  display: flex; align-items: center; gap: 5px;
  font-size: 10px; opacity: 0.55; text-transform: lowercase;
}
.cb-legend .dot { width: 7px; height: 7px; border-radius: 50%; display: block; }
.cb-legend .dash { width: 11px; height: 2px; background: currentColor; display: block; opacity: 0.85; }

/*
 * Der Schnitt je Abschnitt als ein Balken. Die 2px Fuge zwischen den
 * Abschnitten ist kein Zierrat: zwei benachbarte Stufen derselben Rampe würden
 * sonst zu einer Fläche verschmelzen.
 */
.cb-stack { display: flex; height: 8px; gap: 2px; margin-bottom: 9px; }
.cb-stack i { display: block; border-radius: 1px; min-width: 2px; }

.cb-stack-key {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  font-size: 10px;
  margin-bottom: 14px;
  text-transform: lowercase;
}
.cb-stack-key span { display: flex; align-items: center; gap: 5px; opacity: 0.75; }
.cb-stack-key .dot { width: 7px; height: 7px; border-radius: 50%; display: block; }
.cb-stack-key b { font-weight: 700; font-variant-numeric: tabular-nums; }
.cb-stack-key em { font-style: normal; opacity: 0.5; }

/*
 * Der Tooltip hängt am Body, nicht in der Tafel: Tafeln tragen `transform` aus
 * der Einblendung, und ein `position: fixed` darin würde daran kleben statt am
 * Fenster. Er steht damit aber ausserhalb von .cb-app und erbt deren Variablen
 * nicht – Untergrund und Schriftfarbe kommen deshalb aus `data-theme`, das
 * charts.js beim Anzeigen mitgibt.
 */
.cb-tip {
  position: fixed;
  z-index: 90;
  pointer-events: none;
  min-width: 120px;
  padding: 8px 10px;
  border: 1px solid rgba(128, 128, 128, 0.35);
  border-radius: 4px;
  background: #0a0a0a;
  color: #fff;
  font-family: 'Courier Prime', 'Courier New', monospace;
  font-size: 10px;
  line-height: 1.5;
  text-transform: lowercase;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.1s ease, visibility 0.1s ease;
}

.cb-tip[data-theme="light"] {
  background: #ffffff;
  color: #000000;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
}

.cb-tip.on { opacity: 1; visibility: visible; }
.cb-tip .t { opacity: 0.5; margin-bottom: 4px; font-size: 9px; }
.cb-tip .r { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.cb-tip .r b { font-weight: 700; margin-left: auto; padding-left: 14px; font-variant-numeric: tabular-nums; }
.cb-tip .dot { width: 7px; height: 7px; border-radius: 50%; display: block; flex: none; }

/* Die Tabelle unter dem Diagramm: dieselben Zahlen zum Nachlesen und Kopieren. */
.cb-table-fold summary {
  cursor: pointer;
  font-size: 10px;
  opacity: 0.4;
  margin-top: 10px;
  text-transform: lowercase;
  list-style: none;
}
.cb-table-fold summary::-webkit-details-marker { display: none; }
.cb-table-fold summary::before { content: "[ "; }
.cb-table-fold summary::after { content: " ]"; }
.cb-table-fold summary:hover { opacity: 1; color: var(--cb-accent); }
.cb-table-fold[open] .cb-table-times { animation: cbFoldIn 0.3s ease both; }

.cb-table-times { max-height: 220px; overflow: auto; margin-top: 8px; }
.cb-table-times table { width: 100%; border-collapse: collapse; font-size: 10px; }
.cb-table-times th, .cb-table-times td {
  text-align: right; padding: 3px 6px;
  border-bottom: 1px solid var(--cb-line-soft);
  font-variant-numeric: tabular-nums;
}
.cb-table-times th { opacity: 0.5; font-weight: 400; text-transform: lowercase; }
.cb-table-times th:first-child, .cb-table-times td:first-child { text-align: left; }

/* ── Coach ──────────────────────────────────────────────────────────────
 *
 * Alles im Trainer hängt an DIESER Schriftgrösse – die Beschriftungen ebenso
 * wie das Bild der letzten Ebene, die aufgeklappten Steine und die Zugliste.
 * Sie sind darum durchgehend in `em` notiert und nicht in Pixeln: wer den
 * Trainer grösser oder kleiner haben will, dreht hier eine Zahl, und das Panel
 * wächst als Ganzes mit, statt dass Text und Diagramme auseinanderlaufen.
 */
.cb-coach {
  font-size: 14px;
  text-align: left;
}

/* Ausgeblendet, aber der Platz bleibt: sonst springt der Würfel bei jedem
   Schrittwechsel um die Breite des Trainers zur Seite. */
.cb-coach[hidden] { display: block; visibility: hidden; min-height: 180px; }

/* Ganz weg dagegen, wenn es den Trainer gar nicht geben soll – sonst landet er
   als heimatloser Bereich in einer eigenen Rasterzeile. */
.cb-app[data-coach="off"] .cb-coach,
.cb-app[data-mode="timer"] .cb-coach { display: none; }

.cb-coach-stage {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.5em;
  font-size: 1.05em;
  letter-spacing: 0.02em;
  margin-bottom: 0.7em;
}

.cb-coach-stage b { font-weight: 700; }

/* Der Formname ("Sune", "T-Perm") – zweitrangig, aber er ist der Merkanker. */
.cb-coach-stage span {
  font-size: 0.85em;
  opacity: 0.5;
}

/* ── Bild der letzten Ebene (OLL / PLL) ─────────────────────────────────
 *
 * Aufbau wie auf einem Algorithmenblatt: die Deckfläche als 3×3, ringsum
 * schmale Streifen für die Seitenaufkleber. Die vier Ecken des 5×5-Rasters
 * bleiben leer.
 *
 * OLL bekommt vom Solver nur dort eine Farbe, wo die Deckfarbe schon oben
 * liegt – der Rest bleibt dunkel und man sieht die Form. PLL bekommt die
 * Deckfläche geschlossen und ringsum die echten Farben; daran liest man ab,
 * welcher Fall vorliegt.
 */
.cb-coach-diagram {
  display: flex;
  justify-content: center;
  margin-bottom: 0.85em;
}

.cb-coach-diagram:empty { display: none; }

.cb-ll {
  display: grid;
  grid-template-columns: 0.45em repeat(3, 1.6em) 0.45em;
  grid-template-rows: 0.45em repeat(3, 1.6em) 0.45em;
  gap: 0.15em;
}

.cb-ll i {
  border-radius: 1px;
  background: transparent;
}

/*
 * Ein belegtes Feld bekommt einen neutralen Ring nach aussen. Das ist keine
 * Zierde: die Deckfarbe ist im Schema "minimal" fast schwarz, ein reines
 * Farbfeld wäre auf dunklem Grund unsichtbar. Der Ring macht "hier liegt
 * etwas" unabhängig davon lesbar, welche Farbe das Schema gerade vergibt.
 */
.cb-ll i[data-face] { box-shadow: 0 0 0 1px rgba(128, 128, 128, 0.5); }

/* Ein leeres Feld der Deckfläche ist hohl – ein leerer Streifen ist gar nichts. */
.cb-ll i[data-kind="top"]:not([data-face]) {
  box-shadow: inset 0 0 0 1px rgba(128, 128, 128, 0.22);
}

.cb-ll i[data-face="U"] { background: var(--cb-U); }
.cb-ll i[data-face="D"] { background: var(--cb-D); }
.cb-ll i[data-face="F"] { background: var(--cb-F); }
.cb-ll i[data-face="B"] { background: var(--cb-B); }
.cb-ll i[data-face="R"] { background: var(--cb-R); }
.cb-ll i[data-face="L"] { background: var(--cb-L); }

/* ── Die Steine, um die es gerade geht ──────────────────────────────────
 *
 * Der Algorithmus allein sagt nicht, WORAN man arbeitet. Deshalb stehen die
 * beiden Steine darüber – aufgeklappt, in ihren echten Farben, mit ihrem
 * Fundort. Die Farbfelder kommen aus denselben CSS-Variablen wie die Aufkleber
 * am Würfel, das Schema gilt also automatisch auch hier.
 */
.cb-coach-pieces {
  display: flex;
  flex-direction: column;
  gap: 0.5em;
  margin-bottom: 0.7em;
}

.cb-coach-pieces:empty { display: none; }

.cb-coach-pieces figure {
  display: flex;
  align-items: center;
  gap: 0.6em;
  margin: 0;
  padding-left: 0.5em;
  border-left: 2px solid var(--cb-accent);
  transition: opacity 0.15s ease, border-color 0.15s ease;
}

/*
 * Ein Stein, der schon sitzt, bleibt sichtbar – aber zurückgenommen. Beim
 * Einsetzen eines Paars sieht man so, welche Hälfte noch fehlt.
 */
.cb-coach-pieces figure[data-where="placed"] {
  border-left-color: var(--cb-line);
  opacity: 0.4;
}

/*
 * Aufgeklappter Stein. Die Ecke füllt drei Zellen und wird dadurch von selbst
 * L-förmig, die Kante zwei – ohne Sonderfall im JavaScript.
 */
.cb-piece {
  display: grid;
  grid-template-columns: repeat(2, 1em);
  grid-auto-rows: 1em;
  gap: 0.15em;
  flex: none;
}

.cb-piece i {
  border-radius: 2px;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
}

.cb-piece i[data-face="U"] { background: var(--cb-U); }
.cb-piece i[data-face="D"] { background: var(--cb-D); }
.cb-piece i[data-face="F"] { background: var(--cb-F); }
.cb-piece i[data-face="B"] { background: var(--cb-B); }
.cb-piece i[data-face="R"] { background: var(--cb-R); }
.cb-piece i[data-face="L"] { background: var(--cb-L); }

.cb-coach-pieces figcaption {
  font-size: 0.85em;
  line-height: 1.4;
}

.cb-coach-pieces figcaption span {
  display: block;
  opacity: 0.5;
}

/*
 * Ein Listeneintrag je Zug: oben die Notation, darunter die Taste. Die
 * Ausrichtung untereinander ist der ganze Zweck – so lernt man beim Ablesen
 * des Algorithmus die Belegung mit.
 */
.cb-coach-moves {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3em;
  list-style: none;
  margin: 0;
  padding: 0;
  min-height: 2.4em;
}

.cb-coach-moves li {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.1em;
  min-width: 1.6em;
  padding: 0.2em 0.3em;
  border: 1px solid transparent;
  border-radius: 2px;
  transition: opacity 0.15s ease, border-color 0.15s ease;
}

.cb-coach-moves b {
  font-size: 1.05em;
  font-weight: 700;
  line-height: 1;
}

.cb-coach-moves span {
  font-size: 0.85em;
  line-height: 1;
  opacity: 0.55;
}

.cb-coach-moves em { font-style: normal; }

/* Erster von zwei Anschlägen eines Doppelzugs ist erledigt. */
.cb-coach-moves em[data-done] { opacity: 0.25; }

/* Bereits ausgeführt. */
.cb-coach-moves li[data-done] { opacity: 0.3; }

/* Der Zug, der jetzt dran ist. */
.cb-coach-moves li[data-next] {
  border-color: var(--cb-accent);
}

.cb-coach-moves li[data-next] span {
  opacity: 1;
  color: var(--cb-accent);
  font-weight: 700;
}

.cb-coach-note {
  margin-top: 0.6em;
  font-size: 0.85em;
  line-height: 1.5;
  opacity: 0.5;
}

/* Noch nicht gebaute Stufen sollen sichtbar als Baustelle erkennbar sein. */
.cb-coach[data-pending] .cb-coach-stage { opacity: 0.5; }

/* ── Klappbereiche: settings · keys · data ──────────────────────────────
 *
 * Alle drei sind zu. Sie sind Werkzeug, nicht Inhalt: wer sie braucht, sucht
 * sie gezielt, und wer sie nicht braucht, soll den Würfel sehen und nicht neun
 * Zeilen Optionen. Aufgeklappt bleiben sie über einen Reload hinweg NICHT –
 * das wäre ein Zustand mehr, den man aufräumen muss.
 */
.cb-fold {
  border: 1px solid var(--cb-line);
  border-radius: var(--cb-radius);
  font-size: 11px;
  animation: cbPanelIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  animation-delay: calc(var(--i, 0) * 60ms);
}

.cb-fold summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 12px 14px;
  cursor: pointer;
  list-style: none;
  font-size: 12px;
  font-weight: 700;
  text-transform: lowercase;
  transition: color 0.15s ease;
}

.cb-fold summary::-webkit-details-marker { display: none; }
.cb-fold summary:hover { color: var(--cb-accent); }

/* Das Pluszeichen wird beim Aufklappen zum Minus – eine Drehung, kein Ersatz. */
.cb-fold summary i {
  position: relative;
  width: 9px;
  height: 9px;
  flex: none;
  opacity: 0.5;
  transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease;
}

.cb-fold summary i::before,
.cb-fold summary i::after {
  content: "";
  position: absolute;
  inset: 50% 0 auto;
  height: 1px;
  background: currentColor;
}

.cb-fold summary i::after { transform: rotate(90deg); }
.cb-fold[open] summary { color: var(--cb-accent); }
.cb-fold[open] summary i { transform: rotate(135deg); opacity: 1; }

.cb-fold-body {
  padding: 0 14px 14px;
  animation: cbFoldIn 0.28s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.cb-set-group + .cb-set-group { margin-top: 16px; }

.cb-set-title {
  font-size: 9px;
  opacity: 0.4;
  text-transform: lowercase;
  letter-spacing: 0.08em;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--cb-line-soft);
}

.cb-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--cb-line-soft);
}

.cb-row > span { opacity: 0.6; text-transform: lowercase; }

.cb-opts { display: flex; gap: 4px; }

.cb-opts button {
  font: inherit;
  font-size: 10px;
  line-height: 1;
  background: transparent;
  color: inherit;
  border: 1px solid var(--cb-line);
  border-radius: 2px;
  padding: 5px 8px;
  cursor: pointer;
  text-transform: lowercase;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

.cb-opts button[aria-pressed="true"] {
  background: var(--cb-accent);
  border-color: var(--cb-accent);
  color: #fff;
  font-weight: 700;
}

.cb-note {
  padding-top: 9px;
  font-size: 10px;
  opacity: 0.45;
  line-height: 1.6;
  text-transform: lowercase;
}

.cb-fold table { width: 100%; border-collapse: collapse; }

.cb-fold td,
.cb-fold th {
  padding: 3px 0;
  font-weight: 400;
  border-bottom: 1px solid var(--cb-line-soft);
}

.cb-fold td { opacity: 0.75; }

.cb-fold th {
  text-align: right;
  font-weight: 700;
}

.cb-data-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

/* ── Geräte ohne Tastatur ───────────────────────────────────────────────
 *
 * `data-touch` setzt embed.js, wenn weder Zeigegerät noch Hover vorhanden
 * sind. Zu sehen ist dann nur, was dort auch geht: die Stoppuhr. Der virtuelle
 * Würfel bleibt WÄHLBAR – an ein Tablet kann eine Tastatur kommen –, aber er
 * trägt sichtbar, dass er eine braucht, statt den Nutzer raten zu lassen.
 */
.cb-app[data-touch] .cb-keys { display: none; }

.cb-app[data-touch] .cb-switch[data-key="mode"] button[data-value="virtual"] {
  opacity: 0.4;
}

.cb-app[data-touch][data-mode="virtual"] .cb-switch[data-key="mode"] button[data-value="virtual"] {
  opacity: 1;
}

/* Die Zeit-Karte ist dort die Bedienfläche – das darf man ihr ansehen. */
.cb-app[data-touch][data-mode="timer"] .cb-timecard {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.cb-app[data-touch][data-mode="timer"] .cb-timecard:active {
  border-color: var(--cb-accent);
}

/* ── Kleine Displays ────────────────────────────────────────────────── */

/*
 * ACHTUNG bei allem, was `--cb-scale` in einer Container-Abfrage setzt: eine
 * solche Abfrage kann ihren eigenen Behälter NICHT ansprechen, nur dessen
 * Nachkommen. Der Behälter ist .cb-app – die Grösse muss deshalb an .cb-layout
 * hängen, das die Bühne ohnehin enthält.
 */
@container (max-width: 460px) {
  .cb-layout { --cb-scale: 0.72; }
  .cb-app[data-view="hints"] .cb-layout { --cb-scale: 0.55; }
  .cb-tiles { grid-template-columns: repeat(4, 1fr); }
  .cb-panel { padding: 13px; }
}

/*
 * Ab hier ist Breite da, aber die Höhe wird knapp: der Würfel darf wachsen,
 * ohne dass die Seite länger wird als der Bildschirm.
 */
@container (min-width: 700px) {
  .cb-layout { --cb-scale: 1.45; }
  .cb-app[data-view="hints"] .cb-layout { --cb-scale: 1.0; }
  .cb-app[data-camera="front"] .cb-layout { --cb-scale: 1.75; }

  /* Im Timer-Modus ist der Würfel nur Vorschau – die Zeit bekommt den Platz. */
  .cb-app[data-mode="timer"] .cb-layout { --cb-scale: 0.95; }
  .cb-app[data-mode="timer"][data-view="hints"] .cb-layout { --cb-scale: 0.7; }
}

/* Auf niedrigen Fenstern zählt die Höhe mehr als die Breite – daher zuletzt. */
@media (max-height: 780px) {
  .cb-layout { --cb-scale: 1.15; }
  .cb-app[data-view="hints"] .cb-layout { --cb-scale: 0.85; }
  .cb-app[data-mode="timer"] .cb-layout { --cb-scale: 0.8; }
}

@media (prefers-reduced-motion: reduce) {
  .cb-app *, .cb-app *::before, .cb-app *::after, .cb-tip {
    animation: none !important;
    transition: none !important;
  }
}
